[project]
name = "minimal-agent-runtime"
version = "0.1.0"
description = "A minimal Agent runtime built without an Agent framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minimal-agent-web = "agent_runtime.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
